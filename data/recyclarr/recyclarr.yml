# Recyclarr Configuration
# Automatically syncs TRaSH guides to Radarr and Sonarr

# Radarr Configuration
radarr:
  radarr-main:
    base_url: http://radarr:7878
    api_key: 85660fa98c9946e69634b52a4d29826b

    # Quality Definitions - Optimized file sizes
    quality_definition:
      type: movie

    # Quality Profiles
    quality_profiles:
      - name: HD-1080p
        upgrade:
          allowed: true
          until_quality: Bluray-1080p
        qualities:
          - name: Bluray-1080p
          - name: WEB-1080p
          - name: HDTV-1080p

      - name: Ultra-HD
        upgrade:
          allowed: true
          until_quality: Bluray-2160p
        qualities:
          - name: Bluray-2160p
          - name: WEB-2160p
          - name: Bluray-1080p
          - name: WEB-1080p

# Sonarr Configuration
sonarr:
