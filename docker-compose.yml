version: '3.8'

services:
  # Prowlarr - Indexer manager (manages torrent/usenet indexers for *arr apps)
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./data/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    networks:
      - mediavault
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - flaresolverr

  # Bazarr - Subtitle manager (downloads and manages subtitles for movies and TV shows)
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./data/bazarr:/config
      - /mnt/d/MediaVault/Movies:/movies
      - /mnt/d/MediaVault/TV Shows:/tv
      - /mnt/d/MediaVault/Documentaries:/documentaries
    ports:
      - 6767:6767
    restart: unless-stopped
    networks:
      - mediavault

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Etc/UTC
    ports:
      - 8191:8191
    restart: unless-stopped
    networks:
      - mediavault

networks:
  mediavault:
    driver: bridge
