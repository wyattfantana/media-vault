version: '3.8'

services:
  # Prowlarr - Indexer manager (manages torrent/usenet indexers for *arr apps)
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./data/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
    networks:
      - mediavault
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - flaresolverr

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=Etc/UTC
    ports:
      - 8191:8191
    restart: unless-stopped
    networks:
      - mediavault

  # Radarr/Sonarr/Recyclarr removed - MediaVault now uses Prowlarr + qBittorrent directly
