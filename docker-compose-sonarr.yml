version: '3.8'

services:
  # Minimal Sonarr - Just for Bazarr subtitle integration
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./data/sonarr:/config
      - /mnt/d/MediaVault/TV Shows:/tv
    ports:
      - 8989:8989
    restart: unless-stopped
    networks:
      - mediavault

networks:
  mediavault:
    name: media-vault_mediavault
    external: true
